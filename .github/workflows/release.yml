name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify tag and package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./apps/desktop/package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match desktop version $packageVersion."
          }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify public service readiness
        shell: pwsh
        env:
          SUMMONERKIT_RELAY_URL: ${{ vars.SUMMONERKIT_RELAY_URL }}
          SUMMONERKIT_MOBILE_URL: ${{ vars.SUMMONERKIT_MOBILE_URL }}
        run: |
          npm run verify-feed --workspace @summonerkit/data-publisher -- "https://mohamedmagdy2208.github.io/SummonerKit/data/runes-v1.json"
          if (-not $env:SUMMONERKIT_RELAY_URL -or -not $env:SUMMONERKIT_MOBILE_URL) {
            throw "SUMMONERKIT_RELAY_URL and SUMMONERKIT_MOBILE_URL repository variables are required."
          }
          $relay = Invoke-RestMethod -Uri "$($env:SUMMONERKIT_RELAY_URL.TrimEnd('/'))/health" -TimeoutSec 15
          if ($relay.status -ne "ok" -or $relay.service -ne "summonerkit-relay" -or $relay.protocolVersion -ne 1) {
            throw "The deployed relay failed its protocol health check."
          }
          $mobile = Invoke-WebRequest -Uri $env:SUMMONERKIT_MOBILE_URL -TimeoutSec 15
          if ($mobile.StatusCode -ne 200 -or $mobile.Headers.'Content-Type' -notmatch 'text/html') {
            throw "The deployed mobile PWA failed its health check."
          }
      - run: npm run make
      - name: Stage release assets
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $env:RUNNER_TEMP "summonerkit-release"
          New-Item -ItemType Directory -Path $releaseRoot | Out-Null
          $artifacts = Get-ChildItem "apps/desktop/out/make" -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".zip", ".nupkg" -or $_.Name -eq "RELEASES" }
          if (-not $artifacts) { throw "No release artifacts were produced." }
          $artifacts | Copy-Item -Destination $releaseRoot
          "RELEASE_ROOT=$releaseRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Require a signature for stable releases
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME.Contains("-")) { exit 0 }
          $setup = Get-ChildItem -LiteralPath $env:RELEASE_ROOT -Filter "*Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "The stable Setup executable is missing." }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup.FullName
          if ($signature.Status -ne "Valid") {
            throw "Stable releases must be Authenticode signed. Current status: $($signature.Status)."
          }
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem -LiteralPath $env:RELEASE_ROOT -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $lines | Set-Content -LiteralPath (Join-Path $env:RELEASE_ROOT "CHECKSUMS-SHA256.txt") -Encoding utf8
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem -LiteralPath $env:RELEASE_ROOT -File | Select-Object -ExpandProperty FullName
          $arguments = @("release", "create", $env:GITHUB_REF_NAME, "--verify-tag", "--generate-notes", "--title", "SummonerKit $env:GITHUB_REF_NAME")
          if ($env:GITHUB_REF_NAME.Contains("-")) { $arguments += "--prerelease" }
          $arguments += $files
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed." }
