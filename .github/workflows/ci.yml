name: Verify and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build --workspace @summonerkit/mobile
      - run: npm run build --workspace @summonerkit/relay

  windows-prerelease:
    runs-on: windows-latest
    needs: verify
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run make
      - uses: actions/upload-artifact@v7
        with:
          name: summonerkit-unsigned-prerelease-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/out/make/**/*.exe
            apps/desktop/out/make/**/*.zip
            apps/desktop/out/make/**/*.nupkg
            apps/desktop/out/make/**/RELEASES
