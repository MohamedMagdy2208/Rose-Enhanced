name: Deploy encrypted mobile relay

on:
  push:
    branches: [main]
    paths:
      - "apps/relay/**"
      - "packages/remote/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/relay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify relay secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAIRING_ADMIN_SECRET: ${{ secrets.PAIRING_ADMIN_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test ${#PAIRING_ADMIN_SECRET} -ge 32 || (echo "PAIRING_ADMIN_SECRET must contain at least 32 characters" && exit 1)
      - name: Store relay administrator secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAIRING_ADMIN_SECRET: ${{ secrets.PAIRING_ADMIN_SECRET }}
        run: printf '%s' "$PAIRING_ADMIN_SECRET" | npx wrangler secret put PAIRING_ADMIN_SECRET --cwd apps/relay
      - name: Deploy Worker and Durable Object
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace @summonerkit/relay
      - name: Verify deployed relay protocol
        shell: bash
        env:
          SUMMONERKIT_RELAY_URL: ${{ vars.SUMMONERKIT_RELAY_URL }}
        run: |
          if [ -z "$SUMMONERKIT_RELAY_URL" ]; then
            echo "::warning::Worker deployed. Set repository variable SUMMONERKIT_RELAY_URL from the Wrangler deployment URL, then rerun this workflow to verify /health."
            exit 0
          fi
          health="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "${SUMMONERKIT_RELAY_URL%/}/health")"
          HEALTH="$health" node -e 'const h=JSON.parse(process.env.HEALTH); if(h.status!=="ok"||h.service!=="summonerkit-relay"||h.protocolVersion!==1) throw new Error("Unexpected relay health response"); console.log(`Verified relay protocol v${h.protocolVersion} for ${h.mobileOrigin}`)'
